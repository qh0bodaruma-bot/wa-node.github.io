<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Webhookを重複なく登録する流れ</title>
  <desc id="desc">Webhookを受信してすぐ応答し、イベントIDで重複確認を行い、ユーザーIDで顧客を照合してから登録する流れ図</desc>
  <defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#f7f1e3"/><circle cx="4" cy="6" r="1" fill="#e4dac2" opacity=".45"/><circle cx="18" cy="17" r=".8" fill="#e4dac2" opacity=".35"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#b89445"/></marker><style>.jp{font-family:"Noto Sans JP","Yu Gothic",sans-serif}.title{font-size:58px;font-weight:800;fill:#173f35}.lead{font-size:27px;font-weight:700;fill:#102a43}.box-title{font-size:29px;font-weight:800;fill:#173f35}.box-text{font-size:23px;font-weight:600;fill:#35465a}.note{font-size:21px;font-weight:600;fill:#6a5a3b}</style></defs>
  <rect width="1600" height="900" fill="url(#paper)"/><text x="800" y="92" text-anchor="middle" class="jp title">Webhookを重複なく登録する流れ</text><rect x="260" y="128" width="1080" height="72" rx="36" fill="#fffdf8" stroke="#b89445" stroke-width="2"/><text x="800" y="174" text-anchor="middle" class="jp lead">受信・重複確認・顧客照合を分けて設計します</text>
  <g><rect x="55" y="320" width="260" height="250" rx="24" fill="#fffdf8" stroke="#173f35" stroke-width="4"/><text x="185" y="402" text-anchor="middle" class="jp box-title">Webhook受信</text><text x="185" y="450" text-anchor="middle" class="jp box-text">イベントを受け取る</text><text x="185" y="492" text-anchor="middle" class="jp note">署名を確認</text>
  <rect x="360" y="320" width="260" height="250" rx="24" fill="#fffdf8" stroke="#b89445" stroke-width="4"/><text x="490" y="402" text-anchor="middle" class="jp box-title">すぐ応答</text><text x="490" y="450" text-anchor="middle" class="jp box-text">200番台を返す</text><text x="490" y="492" text-anchor="middle" class="jp note">処理は別に進める</text>
  <rect x="665" y="320" width="270" height="250" rx="24" fill="#fffdf8" stroke="#b89445" stroke-width="4"/><text x="800" y="402" text-anchor="middle" class="jp box-title">重複確認</text><text x="800" y="450" text-anchor="middle" class="jp box-text">webhookEventId</text><text x="800" y="492" text-anchor="middle" class="jp note">同じイベントは登録しない</text>
  <rect x="980" y="320" width="260" height="250" rx="24" fill="#fffdf8" stroke="#173f35" stroke-width="4"/><text x="1110" y="402" text-anchor="middle" class="jp box-title">顧客照合</text><text x="1110" y="450" text-anchor="middle" class="jp box-text">LINEユーザーID</text><text x="1110" y="492" text-anchor="middle" class="jp note">表示名は使わない</text>
  <rect x="1285" y="320" width="260" height="250" rx="24" fill="#fffdf8" stroke="#173f35" stroke-width="4"/><text x="1415" y="402" text-anchor="middle" class="jp box-title">業務システム</text><text x="1415" y="450" text-anchor="middle" class="jp box-text">受付記録を登録</text><text x="1415" y="492" text-anchor="middle" class="jp note">失敗時はログへ</text></g>
  <path d="M315 445h35M620 445h35M935 445h35M1240 445h35" stroke="#b89445" stroke-width="8" marker-end="url(#arrow)"/><rect x="150" y="680" width="1300" height="112" rx="20" fill="#173f35"/><text x="800" y="726" text-anchor="middle" class="jp" font-size="24" font-weight="800" fill="#fffdf8">確認ポイント</text><text x="800" y="764" text-anchor="middle" class="jp" font-size="22" font-weight="600" fill="#fffdf8">イベントの重複と、同じ顧客の照合は別のキーで確認する</text>
</svg>
