  <g fill="#0a4e8c" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-weight="700" font-size="25">
    <text x="106" y="534">問い合わせ</text><text x="410" y="534">問い合わせ</text>
  </g>
  <g fill="#75a8d5"><rect x="106" y="558" width="170" height="13" rx="6"/><rect x="106" y="588" width="210" height="13" rx="6"/><rect x="410" y="558" width="170" height="13" rx="6"/><rect x="410" y="588" width="210" height="13" rx="6"/></g>
  <g fill="#8aa7c4" font-family="Arial, sans-serif" font-size="19"><text x="106" y="623">2026/09/25 10:00</text><text x="410" y="623">2026/09/25 10:00</text></g>
  <path d="M348 564h31M652 564h155" stroke="#fff" stroke-width="9" fill="none" marker-end="url(#arrow)"/>
  <rect x="260" y="687" width="220" height="58" rx="29" fill="#d7192f" stroke="#fff" stroke-width="5"/>
  <text x="370" y="727" text-anchor="middle" fill="#fff" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="30" font-weight="800">重複判定</text>
  <path d="M213 642v45M517 642v45M213 687h47M517 687h-37" stroke="#fff" stroke-width="5" fill="none"/>

