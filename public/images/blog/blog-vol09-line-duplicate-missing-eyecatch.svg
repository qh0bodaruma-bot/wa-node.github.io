    <text x="64" y="222" font-size="78">登録漏れを防ぐ</text>
  </g>
  <text x="64" y="296" fill="#ffe33d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="43" font-weight="800">Webhookの再送と重複に備える設計</text>
  <rect x="58" y="332" width="850" height="74" rx="37" fill="#d7192f"/>
  <text x="483" y="383" text-anchor="middle" fill="#fff" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="36" font-weight="800">再送・重複・失敗時の確認</text>

  <g filter="url(#shadow)">
