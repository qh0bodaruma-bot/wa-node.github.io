<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">二重登録・登録漏れを防ぐ</title>
  <desc id="desc">Webhookの再送と重複に備え、問い合わせを重複判定して1件のデータとして登録する概念図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062b55"/>
      <stop offset="1" stop-color="#0c5ca2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001a35" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#f5f7fb"/>
    </marker>
  </defs>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <rect x="1040" y="0" width="632" height="941" fill="#0b4d88" opacity=".42"/>
  <g fill="#fff" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-weight="800">
