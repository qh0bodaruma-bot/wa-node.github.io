<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">登録失敗から再登録までの流れ</title>
  <desc id="desc">業務システムへの登録が失敗したときにログを残し、担当者へ通知して再登録する流れ図</desc>
  <defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#f7f1e3"/><circle cx="4" cy="6" r="1" fill="#e4dac2" opacity=".45"/><circle cx="18" cy="17" r=".8" fill="#e4dac2" opacity=".35"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#b89445"/></marker><style>.jp{font-family:"Noto Sans JP","Yu Gothic",sans-serif}.title{font-size:58px;font-weight:800;fill:#173f35}.lead{font-size:27px;font-weight:700;fill:#102a43}.box-title{font-size:29px;font-weight:800;fill:#173f35}.box-text{font-size:23px;font-weight:600;fill:#35465a}.note{font-size:21px;font-weight:600;fill:#6a5a3b}</style></defs>
  <rect width="1600" height="900" fill="url(#paper)"/><text x="800" y="92" text-anchor="middle" class="jp title">登録失敗から再登録までの流れ</text><rect x="250" y="128" width="1100" height="72" rx="36" fill="#fffdf8" stroke="#b89445" stroke-width="2"/><text x="800" y="174" text-anchor="middle" class="jp lead">再送だけに頼らず、失敗を記録して人が確認できる状態にします</text>
  <rect x="90" y="330" width="300" height="250" rx="24" fill="#fffdf8" stroke="#173f35" stroke-width="4"/><text x="240" y="412" text-anchor="middle" class="jp box-title">登録処理</text><text x="240" y="460" text-anchor="middle" class="jp box-text">業務システムへ送信</text><text x="240" y="502" text-anchor="middle" class="jp note">成功／失敗を判定</text>
  <rect x="460" y="330" width="300" height="250" rx="24" fill="#fffdf8" stroke="#b89445" stroke-width="4"/><text x="610" y="412" text-anchor="middle" class="jp box-title">失敗を記録</text><text x="610" y="460" text-anchor="middle" class="jp box-text">イベントID・内容・時刻</text><text x="610" y="502" text-anchor="middle" class="jp note">あとで追える形にする</text>
  <rect x="830" y="330" width="300" height="250" rx="24" fill="#fffdf8" stroke="#b89445" stroke-width="4"/><text x="980" y="412" text-anchor="middle" class="jp box-title">担当者へ通知</text><text x="980" y="460" text-anchor="middle" class="jp box-text">誰が確認するか決める</text><text x="980" y="502" text-anchor="middle" class="jp note">放置を防ぐ</text>
  <rect x="1200" y="330" width="300" height="250" rx="24" fill="#fffdf8" stroke="#173f35" stroke-width="4"/><text x="1350" y="412" text-anchor="middle" class="jp box-title">再登録</text><text x="1350" y="460" text-anchor="middle" class="jp box-text">失敗分を安全に再処理</text><text x="1350" y="502" text-anchor="middle" class="jp note">重複確認を再実行</text>
  <path d="M390 455h62M760 455h62M1130 455h62" stroke="#b89445" stroke-width="8" marker-end="url(#arrow)"/><rect x="220" y="680" width="1160" height="112" rx="20" fill="#173f35"/><text x="800" y="726" text-anchor="middle" class="jp" font-size="24" font-weight="800" fill="#fffdf8">確認ポイント</text><text x="800" y="764" text-anchor="middle" class="jp" font-size="22" font-weight="600" fill="#fffdf8">失敗した問い合わせを、誰が・どこで・どう再登録するかを決める</text>
</svg>
