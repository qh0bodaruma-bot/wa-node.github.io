<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">受信と登録を別々に確認する</title><desc id="desc">LINE、連携サーバー、業務システムの間で、受信と登録をそれぞれ確認する</desc><rect width="1600" height="900" fill="#f6f8f9"/><text x="100" y="130" fill="#11243d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="62" font-weight="700">受信と登録を、別々に確認する</text><rect x="100" y="286" width="360" height="230" rx="20" fill="#e5f0ed"/><text x="178" y="423" fill="#11243d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="54" font-weight="700">LINE</text><path d="M460 399h125" stroke="#397e77" stroke-width="12"/><path d="M575 378l35 21-35 21" fill="none" stroke="#397e77" stroke-width="12"/><rect x="620" y="286" width="360" height="230" rx="20" fill="#e5edf3"/><text x="667" y="423" fill="#11243d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="49" font-weight="700">連携サーバー</text><path d="M980 399h125" stroke="#397e77" stroke-width="12"/><path d="M1095 378l35 21-35 21" fill="none" stroke="#397e77" stroke-width="12"/><rect x="1140" y="286" width="360" height="230" rx="20" fill="#e5edf3"/><text x="1170" y="423" fill="#11243d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="47" font-weight="700">業務システム</text><rect x="390" y="590" width="355" height="130" rx="16" fill="#fff" stroke="#397e77" stroke-width="5"/><text x="436" y="672" fill="#11243d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="46" font-weight="700">受信を確認</text><rect x="910" y="590" width="355" height="130" rx="16" fill="#fff" stroke="#d85e59" stroke-width="5"/><text x="956" y="672" fill="#11243d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="46" font-weight="700">登録を確認</text><text x="102" y="820" fill="#526475" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="32">※概念図。確認画面や記録は実際の構成によって異なります。</text></svg>
