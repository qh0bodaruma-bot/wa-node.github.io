<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">異常時の確認表</title><desc id="desc">受信、登録、復旧後の照合について確認箇所と担当を決める表</desc><rect width="1600" height="900" fill="#f6f8f9"/><text x="100" y="125" fill="#11243d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="62" font-weight="700">異常時に、誰がどこを見るか</text><rect x="100" y="212" width="1400" height="112" fill="#11243d"/><g fill="#fff" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="40" font-weight="700"><text x="135" y="283">段階</text><text x="442" y="283">確認する場所</text><text x="945" y="283">担当者</text></g><g fill="#11243d" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="39"><text x="135" y="408">受信</text><text x="442" y="386">Webhookエラー</text><text x="442" y="433">受信記録</text><text x="945" y="408">保守担当</text><text x="135" y="565">登録</text><text x="442" y="565">登録先・処理結果</text><text x="945" y="565">業務・保守担当</text><text x="135" y="722">復旧後</text><text x="442" y="722">受付と登録先を照合</text><text x="945" y="722">業務担当</text></g><g stroke="#cbd7de" stroke-width="3"><path d="M100 324h1400M100 481h1400M100 638h1400M100 795h1400"/><path d="M402 212v583M904 212v583"/></g><text x="100" y="851" fill="#526475" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="29">※担当者は記入例。実際の運用に合わせて決めてください。</text></svg>
