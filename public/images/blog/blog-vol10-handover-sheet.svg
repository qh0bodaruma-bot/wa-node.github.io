<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">接続キーの引き継ぎ用台帳の例</title>
<desc id="desc">キーの値は書かず、用途、保管場所、権限、更新担当、交換時の影響を記録する台帳の例</desc>
<defs>
<style>.jp{font-family:'Noto Sans JP','Yu Gothic',sans-serif}.title{font-size:57px;font-weight:800;fill:#173f35}.sub{font-size:31px;font-weight:600;fill:#31554a}.head{font-size:30px;font-weight:800;fill:#fffdf8}.cell{font-size:29px;font-weight:700;fill:#173f35}.small{font-size:24px;font-weight:600;fill:#425951}</style>
</defs>
<rect width="1600" height="900" fill="#f7f1e3"/>
<text x="80" y="103" class="jp title">引き継ぎ用の一枚に残すこと</text>
<text x="82" y="154" class="jp sub">接続キーの値ではなく、管理の手掛かりを共有する</text>
