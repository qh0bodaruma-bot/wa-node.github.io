<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">今は運用整理か、システム連携か</title>
  <desc id="desc">情報の保存先、対応状態の共有、転記や担当者不在時の停滞を順番に確認し、現在の運用整理で足りるか、システム連携を検討するかを判断するチャート。</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f7f1e3"/>
      <circle cx="5" cy="7" r="1" fill="#e4dac2" opacity=".42"/>
      <circle cx="19" cy="18" r=".8" fill="#e4dac2" opacity=".32"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b89445"/>
    </marker>
    <style>
      .jp { font-family: "Noto Sans JP", "Yu Gothic", sans-serif; }
      .title { font-size: 58px; font-weight: 800; fill: #173f35; }
      .q { font-size: 28px; font-weight: 800; fill: #102a43; }
      .small { font-size: 21px; font-weight: 700; fill: #6a5a3b; }
      .result { font-size: 28px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <path d="M0 0h250c-36 34-61 76-72 126-52-14-111-10-178 14z" fill="#173f35" opacity=".07"/>
  <path d="M1600 900h-270c34-38 57-81 68-129 59 17 126 12 202-13z" fill="#b89445" opacity=".12"/>

  <text x="800" y="90" text-anchor="middle" class="jp title">今は運用整理か、システム連携か</text>
  <text x="800" y="134" text-anchor="middle" class="jp small">上から順に、現在の運用を確認します</text>

  <rect x="460" y="185" width="680" height="105" rx="24" fill="#fffdf8" stroke="#173f35" stroke-width="4"/>
  <text x="800" y="250" text-anchor="middle" class="jp q">情報の保存先が決まっている？</text>

  <path d="M460 237H250v113" fill="none" stroke="#b89445" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="341" y="219" class="jp small">いいえ</text>
  <rect x="70" y="362" width="360" height="112" rx="22" fill="#fff4dd" stroke="#b89445" stroke-width="4"/>
  <text x="250" y="407" text-anchor="middle" class="jp result" fill="#6a4b12">まず保存先を決める</text>
  <text x="250" y="444" text-anchor="middle" class="jp small">項目ごとの確認場所を統一</text>

  <path d="M800 290v72" stroke="#b89445" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="824" y="337" class="jp small">はい</text>
  <rect x="460" y="372" width="680" height="105" rx="24" fill="#fffdf8" stroke="#173f35" stroke-width="4"/>
  <text x="800" y="437" text-anchor="middle" class="jp q">対応状態と確認役を共有できる？</text>

  <path d="M1140 425h210v96" fill="none" stroke="#b89445" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="1185" y="405" class="jp small">いいえ</text>
  <rect x="1170" y="533" width="360" height="112" rx="22" fill="#fff4dd" stroke="#b89445" stroke-width="4"/>
  <text x="1350" y="578" text-anchor="middle" class="jp result" fill="#6a4b12">運用ルールを整える</text>
  <text x="1350" y="615" text-anchor="middle" class="jp small">状態表記と代替確認者を決定</text>

  <path d="M800 477v72" stroke="#b89445" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="824" y="524" class="jp small">はい</text>
  <rect x="460" y="559" width="680" height="105" rx="24" fill="#fffdf8" stroke="#173f35" stroke-width="4"/>
  <text x="800" y="624" text-anchor="middle" class="jp q">転記や不在時の停滞が繰り返される？</text>

  <path d="M460 612H250v86" fill="none" stroke="#b89445" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="341" y="591" class="jp small">いいえ</text>
  <rect x="70" y="710" width="360" height="112" rx="22" fill="#edf3ef" stroke="#173f35" stroke-width="4"/>
  <text x="250" y="755" text-anchor="middle" class="jp result" fill="#173f35">現行運用を続ける</text>
  <text x="250" y="792" text-anchor="middle" class="jp small">定期的に困りごとを再確認</text>

  <path d="M800 664v52" stroke="#b89445" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="824" y="700" class="jp small">はい</text>
  <rect x="560" y="728" width="480" height="112" rx="22" fill="#173f35" stroke="#173f35" stroke-width="4"/>
  <text x="800" y="776" text-anchor="middle" class="jp result" fill="#fffdf8">連携する範囲を検討する</text>
  <text x="800" y="813" text-anchor="middle" class="jp" font-size="21" font-weight="700" fill="#e9d8aa">必要な部分だけ、小さく始める</text>
</svg>
